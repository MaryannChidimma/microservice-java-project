server.port=8082
spring.application.name=product-service

spring.mongodb.uri=mongodb://localhost:27017/productdb

springdoc.swagger-ui.path=/swagger-ui.html
# springdoc 2.6.0 targets Spring Boot 3: scanning @RestControllerAdvice fails on Boot 4
springdoc.override-with-generic-response=false

# Health endpoints for the Kubernetes probes (/actuator/health/readiness, /liveness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Finish in-flight requests before the pod exits
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s