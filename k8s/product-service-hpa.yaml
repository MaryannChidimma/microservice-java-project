# Autoscaling for product-service: add a pod when average CPU passes 80% of
# the 100m each pod requests, between 2 and 3 pods. An idle pod sits at
# 20-50%, so a much lower target would never scale back down.
#
# Watch it:  kubectl get hpa product-service --watch
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service
  labels:
    depot.platform/managed: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  # 2 is what the Deployment already runs (the Pod Recovery demo needs two)
  minReplicas: 2
  # One extra pod is all the 4 GB Minikube has room to start under load
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    # Default is 5 minutes; one minute keeps the demo watchable
    scaleDown:
      stabilizationWindowSeconds: 60
