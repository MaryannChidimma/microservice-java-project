apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://host.minikube.internal:5434/orderdb
            - name: CLIENTS_USER_SERVICE_URL
              value: http://user-service:8081
            - name: CLIENTS_PRODUCT_SERVICE_URL
              value: http://product-service:8082
            - name: NOTIFICATIONS_URL
              value: http://notify-java.default.svc.cluster.local
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi