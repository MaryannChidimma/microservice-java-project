apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    depot.platform/managed: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: product-service
          image: product-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_MONGODB_URI
              value: mongodb://host.minikube.internal:27017/productdb
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi
          # Up to 2 minutes to start; no traffic until Spring reports ready
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            failureThreshold: 3
          # Keep serving while the Service stops routing to this pod
          lifecycle:
            preStop:
              sleep:
                seconds: 5