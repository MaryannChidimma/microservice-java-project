server.port=8083
spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5434/orderdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
# springdoc 2.6.0 targets Spring Boot 3: scanning @RestControllerAdvice fails on Boot 4
springdoc.override-with-generic-response=false

# Serverless notify function, called after an order is placed. Empty = disabled.
notifications.url=
